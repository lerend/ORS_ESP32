<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Web BLE App - Config</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        h1, h2 { color: #333; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; margin-top: 5px; margin-right: 10px; }
        button:hover { background-color: #0056b3; }
        #disconnectBleButton { background-color: #dc3545; }
        #disconnectBleButton:hover { background-color: #c82333; }
        input[type="text"] { padding: 8px; margin-top: 5px; width: 100%; box-sizing: border-box; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        strong { font-size: 1.1em; }
        
        .header-inline {
            display: flex;         /* Richtet die Elemente nebeneinander aus */
            align-items: center;   /* Zentriert sie vertikal auf einer Linie */
            gap: 15px;             /* Abstand zwischen Text und Wert */
            margin-top: 20px;
        }

        .header-inline h2 {
            margin: 0;             /* Entfernt Standard-Abstände der Überschrift */
        }

        #SensorIDContainer {
            font-size: 1.2em;
            font-weight: bold;
            color: #007bff;        /* Eine schöne Farbe für den aktuellen Wert */
        }
        
        /* Container für Eingabe und Button */
        .input-group {
            display: flex;
            gap: 10px;           /* Abstand zwischen Feld und Button */
            margin-top: 10px;
            align-items: center; /* Gleicht kleine Höhenunterschiede aus */
        }

        /* Das Eingabefeld soll den verfügbaren Platz nutzen */
        .input-group input[type="text"] {
            flex: 1;             /* Lässt das Feld wachsen */
            margin-top: 0;       /* Entfernt den alten Margin für saubere Optik */
            height: 40px;        /* Einheitliche Höhe */
        }

        /* Der Button */
        .input-group button {
            margin-top: 0;       /* Entfernt den alten Margin */
            height: 40px;        /* Gleiche Höhe wie das Input-Feld */
            white-space: nowrap; /* Verhindert Zeilenumbruch im Button-Text */
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ESP32 Web BLE Application</h1>
    <div id="statusConsole" style="background: #333; color: #0f0; padding: 10px; font-family: monospace; border-radius: 5px; margin-bottom: 10px; height: 100px; overflow-y: auto;">
    > System bereit...
</div>
    <button id="connectBleButton">Connect to BLE Device</button>
    <button id="disconnectBleButton" class="hidden">Disconnect BLE Device</button>
    <p>BLE state: <strong><span id="bleState" style="color:#d13a30;">Disconnected</span></strong></p>

    <hr>

    <div class="header-inline">
        <h2>SensorID:</h2>
        <span id="SensorIDContainer">---</span>
    </div>
    <div class="input-group">
        <input type="text" id="SensorIDInput" placeholder="Enter new SensorID">
        <button id="sendSensorIDButton" class="hidden" disabled>Send</button>
    </div>

    <hr>

    <div class="header-inline">
        <h2>MQTT User:</h2>
        <span id="mqttUserContainer">---</span>
    </div>
    <div class="input-group">
        <input type="text" id="mqttUserInput" placeholder="Enter new MQTT username">
        <button id="sendMqttUserButton" class="hidden" disabled>Send</button>
    </div>

    <hr>

    <div class="header-inline">
        <h2>MQTT PW:</h2>
        <span id="mqttPWContainer">---</span>
    </div>
    <div class="input-group">
        <input type="text" id="mqttPWInput" placeholder="Enter new MQTT Password">
        <button id="sendMqttPWButton" class="hidden" disabled>Send</button>
    </div>
    
    <hr>
    
    <div class="header-inline">
        <h2>Network APN:</h2>
        <span id="APNContainer">---</span>
    </div>
    <div class="input-group">
        <input type="text" id="APNInput" placeholder="Enter new APN">
        <button id="sendAPNButton" class="hidden" disabled>Send</button>
    </div>
    
    <hr>
    
    <div class="header-inline">
        <h2>SleepTime in Minutes:</h2>
        <span id="SleepTimeContainer">---</span>
    </div>
    <div class="input-group">
        <input type="number" id="SleepTimeInput" min="1" max="360" placeholder="1 - 360 Minuten">
        <button id="sendSleepTimeButton" class="hidden" disabled>Send</button>
    </div>
    
    <hr>
</div>

<footer style="text-align: right; padding: 10px;">
    <small style="color: #888;">Web-Interface Version: <span id="web-version"></span></small>
</footer>

</body>
<script>
    const WEB_VERSION = "0.9.1";
    // DOM Elements
    const connectButton = document.getElementById('connectBleButton');
    const disconnectButton = document.getElementById('disconnectBleButton');
    
    const bleStateContainer = document.getElementById('bleState');
   // const timestampContainer = document.getElementById('timestamp');

    // DOM-ELEMENTE FÃœR MQTT USER
    const mqttUserContainer = document.getElementById('mqttUserContainer');
    const mqttUserInput = document.getElementById('mqttUserInput');
    const mqttPWContainer = document.getElementById('mqttPWContainer');
    const mqttPWInput = document.getElementById('mqttPWInput');
    const sendMqttPWButton = document.getElementById('sendMqttPWButton');
    const SensorIDContainer = document.getElementById('SensorIDContainer');
    const SensorIDInput = document.getElementById('SensorIDInput');
    const sendSensorIDButton = document.getElementById('sendSensorIDButton');
    const sendMqttUserButton = document.getElementById('sendMqttUserButton');
    const APNContainer = document.getElementById('APNContainer');
    const APNInput = document.getElementById('APNInput');
    const sendAPNButton = document.getElementById('sendAPNButton');
    const SleepTimeContainer = document.getElementById('SleepTimeContainer');
    const SleepTimeInput = document.getElementById('SleepTimeInput');
    const sendSleepTimeButton = document.getElementById('sendSleepTimeButton');

    
    // const lastMqttUserSent = document.getElementById('lastMqttUserSent'); // HinzugefÃ¼gt: FÃ¼r die Anzeige des gesendeten Werts

    // Define BLE Device Specs (MÃ¼ssen mit ARDUINO Ã¼bereinstimmen!)
    var deviceName ='ORS_ESP32_Sensor';
    var bleService = '19b10000-e8f2-537e-4f6c-d104768a1214';
    var sensorIDCharacteristic= '19b10001-e8f2-537e-4f6c-d104768a1214';
    var MQTTUserCharacteristic = '149df1e1-4d59-4529-befb-b6d5a2c0fe33';
    var MQTTPWCharacteristic = 'fafc1daf-dff4-4254-854b-c0b0a6e5ba31';
    var SleepTimeCharacteristic = '2efb949c-1707-4c22-b0e0-8112efe7ba68'; //'73f12ab4-1a2d-41a4-9642-1e962803c767';
    var StatusLogCharacteristic = '62f1437c-3965-430c-9742-1277a06d9a91';
    var APNCharacteristic = '3a14b289-1f67-4084-8a5e-c4a1e22d3388';

    //Global Variables to Handle Bluetooth
    var bleServer;
    var bleServiceFound;
    var sensorCharacteristicFound;
    var MQTTUserCharacteristicFound; 
    var MQTTPWCharacteristicFound;
    var APNCharacteristicFound;
    var SleepTimeCharacteristicFound;

    // Konfiguration der Standardwerte
    const DEFAULTS = {
        SENSOR_ID: "sensor_id",
        MQTT_USER: "admin",
        MQTT_PW: "12345"
    };

    // Beim Laden der Seite (bevor BLE verbunden ist) die Felder füllen
    window.addEventListener('DOMContentLoaded', () => {

        document.getElementById('SensorIDInput').value = DEFAULTS.SENSOR_ID;
        document.getElementById('mqttPWInput').value = DEFAULTS.MQTT_PW;
        // document.getElementById('APNContainer').innerHTML = DEFAULTS.APN;
    
        document.getElementById('mqttUserInput').value = DEFAULTS.MQTT_USER;
        //document.getElementById('mqttUserContainer').innerHTML = DEFAULTS.MQTT_USER;

        document.getElementById('web-version').innerText = WEB_VERSION;
    });
    
    connectButton.addEventListener('click', (event) => {
        if (isWebBluetoothEnabled()){
            connectToDevice();
        }
    });

    disconnectButton.addEventListener('click', disconnectDevice);

    // Write to the ESP32 Config Characteristic
    sendMqttUserButton.addEventListener('click', sendNewMqttUserValue); 
    sendMqttPWButton.addEventListener('click', sendNewMqttPWValue); 
    sendAPNButton.addEventListener('click', sendNewAPNValue); 
    sendSensorIDButton.addEventListener('click', sendNewSensorIDValue); 
    sendSleepTimeButton.addEventListener('click', sendNewSleepTimeValue);

    // Check if BLE is available in your Browser
    function isWebBluetoothEnabled() {
        if (!navigator.bluetooth) {
            // console.log("Web Bluetooth API is not available in this browser!");
            bleStateContainer.innerHTML = "Web Bluetooth API is not available in this browser!";
            return false
        }
        // console.log('Web Bluetooth API supported in this browser.');
        return true
    }

    // Connect to BLE Device and Enable Notifications + READ Configuration
    function connectToDevice(){
        // console.log('Initializing Bluetooth...');
        navigator.bluetooth.requestDevice({
            filters: [{ namePrefix: 'ORS' }],
            //filters: [{name: deviceName}],
            //acceptAllDevices: true,
            optionalServices: [bleService]
        })
        .then(device => {
            console.log('Device Selected:', device.name);
            bleStateContainer.innerHTML = 'Connected to device ' + device.name;
            device.addEventListener('gattserverdisconnected', onDisconnected);
            bleStateContainer.style.color = "#24af37";
            //device.addEventListener('gattservicedisconnected', onDisconnected);
            return device.gatt.connect();
        })
        .then(gattServer =>{
            bleServer = gattServer;
            console.log("Connected to GATT Server");
            return bleServer.getPrimaryService(bleService);
        })
        .then(service => {
            bleServiceFound = service;
            console.log("Service discovered:", service.uuid);
            // Zuerst Sensor-Charakteristik abrufen und Notifications starten
            return service.getCharacteristic(sensorIDCharacteristic);
        })
        .then(characteristic => {
            console.log("Sensor Characteristic discovered:", characteristic.uuid);
            sensorCharacteristicFound = characteristic;
            //characteristic.addEventListener('characteristicvaluechanged', handleCharacteristicChange);
            //characteristic.startNotifications();
            //console.log("Sensor Notifications Started.");
            return characteristic.readValue();
        })
        .then(value => {
            // Sensorwert verarbeiten
            //window.alert("erster Wert gefunden!");
            console.log("first value found.");
            const decodedValue = new TextDecoder().decode(value);
            SensorIDContainer.innerHTML = decodedValue;
            //SensorIDInput.value = decodedValue; // Wert in das Eingabefeld setzen
            console.log("Initial SensorID Value read: ", decodedValue);
            return bleServiceFound.getCharacteristic(MQTTUserCharacteristic); 
         })
        .then(characteristic => {
            //window.alert("MQTT Characteristic gefunden!");
            console.log("MQTT found");
            MQTTUserCharacteristicFound = characteristic;
            return characteristic.readValue(); 
        })
        .then(value => {
            const decodedConfig = new TextDecoder().decode(value);
            mqttUserContainer.innerHTML = decodedConfig;
            //mqttUserInput.value = decodedConfig; // Wert in das Eingabefeld setzen
            console.log("Initial MQTT User Value read: ", decodedConfig);
            return bleServiceFound.getCharacteristic(APNCharacteristic); 
         })
        .then(characteristic => {
            //window.alert("APN Characteristic gefunden!");
            console.log("APN found");
            APNCharacteristicFound = characteristic;
            return characteristic.readValue(); 
        })
        .then(value => {
            const decodedConfig = new TextDecoder().decode(value);
            APNContainer.innerHTML = decodedConfig;
            APNInput.value = decodedConfig; // Wert in das Eingabefeld setzen
            console.log("Initial APN Value read: ", decodedConfig);
            //window.alert("Initial APN Value read: ", decodedConfig);
            return bleServiceFound.getCharacteristic(MQTTPWCharacteristic); 
         })
        .then(characteristic => {
            console.log("MQTTPW Characteristic found");
            MQTTPWCharacteristicFound = characteristic;
            return characteristic.readValue(); 
        })
        .then(value => {
            const decodedConfig = new TextDecoder().decode(value);
            mqttPWContainer.innerHTML = decodedConfig;
            mqttPWInput.value = decodedConfig;
            return bleServiceFound.getCharacteristic(SleepTimeCharacteristic);
        })
        .then(characteristic => {
            console.log("SleepTime Characteristic gefunden!");
            SleepTimeCharacteristicFound = characteristic;
            return characteristic.readValue();
        })
        .then(value => {
            const decodedSleep = new TextDecoder().decode(value);
            SleepTimeContainer.innerHTML = decodedSleep;
            SleepTimeInput.value = decodedSleep;
            console.log("Initial SleepTime Value read: ", decodedSleep);
            console.log("Alles geladen!");
            updateButtonVisibility(true); // Buttons umschalten
        })
        .then(() => {
            return bleServiceFound.getCharacteristic(StatusLogCharacteristic);
        })
        .then(characteristic => {
        // Notifications abonnieren
            characteristic.addEventListener('characteristicvaluechanged', (event) => {
            const value = new TextDecoder().decode(event.target.value);
            const console = document.getElementById('statusConsole');
            console.innerHTML += "<br>> " + value; // Neue Nachricht hinzufügen
            console.scrollTop = console.scrollHeight; // Automatisch nach unten scrollen
        });
    return characteristic.startNotifications();
    })
    .then(() => {
        console.log("Status-Logs aktiviert.");
    })
        .catch(error => {
            window.alert("FEHLER: " + error.name + " - " + error.message);
            console.log('Error: ', error);
            updateButtonVisibility(false); // Zurück zum Connect-Button bei Fehler
        });
     }

    function onDisconnected(event) {
        const device = event.target;
        console.log('Device ' + device.name + ' is disconnected.');

        // UI zurücksetzen
        bleStateContainer.innerHTML = "Disconnected (Remote)";
        bleStateContainer.style.color = "#d13a30";
    
        // Die Buttons wieder umschalten (Connect zeigen, Send verstecken)
        updateButtonVisibility(false);

        // Variablen leeren, damit kein alter Müll bleibt
        bleServer = null;
        bleServiceFound = null;
    }
     
  /*  function onDisconnected(event){
        console.log('Device Disconnected:', event.target.device.name);
        bleStateContainer.innerHTML = "Device disconnected";
        bleStateContainer.style.color = "#d13a30";
        updateButtonVisibility(false); // Connect wieder zeigen
        // Hinweis: Automatische Wiederverbindung ist deaktiviert, falls die 30s-Logik im Arduino aktiv ist.
    }*/
 
    function disconnectDevice() {
        if (bleServer && bleServer.connected) {
            bleServer.disconnect();
            // Wir brauchen hier kein alert oder updateButtonVisibility, 
            // da das 'gattserverdisconnected' Event oben automatisch feuert!
        } else {
            // Falls das Board schon weg ist, einfach nur die UI aufräumen
            console.log("Bluetooth already disconnected.");
            updateButtonVisibility(false);
        }
    }

    function sendNewSensorIDValue() {
      if (bleServer && bleServer.connected) {
        const valueToSend = SensorIDInput.value;

        // Konvertiere String in Byte-Array
        const encoder = new TextEncoder();
        const data = encoder.encode(valueToSend);

        bleServiceFound.getCharacteristic(sensorIDCharacteristic)
            .then(characteristic => {
                // Schreibe das Byte-Array auf die Charakteristik
                // return characteristic.writeValue(data);
                return characteristic.writeValueWithoutResponse(data); 
            })
            .then(() => {
                // ERFOLG: Anzeige aktualisieren
                //window.alert("New MQTT-User saved: " + valueToSend);
                SensorIDContainer.innerHTML = valueToSend;
            })
            .catch(error => {
                // FEHLER: Etwas ging schief
                console.error("Fehler beim Schreiben:", error);
                window.alert("Error while saving: " + error.message);
                
            });

      } else {
        window.alert("Bluetooth is not connected. \nConnect to BLE first!");
      }
    }

    
    function sendNewMqttUserValue() {
      if (bleServer && bleServer.connected) {
        const valueToSend = mqttUserInput.value;

        // Konvertiere String in Byte-Array
        const encoder = new TextEncoder();
        const data = encoder.encode(valueToSend);

        bleServiceFound.getCharacteristic(MQTTUserCharacteristic)
            .then(characteristic => {
                // Schreibe das Byte-Array auf die Charakteristik
                // return characteristic.writeValue(data);
                return characteristic.writeValueWithoutResponse(data); 
            })
            .then(() => {
                // ERFOLG: Anzeige aktualisieren
                //window.alert("New MQTT-User saved: " + valueToSend);
                mqttUserContainer.innerHTML = valueToSend;
            })
            .catch(error => {
                // FEHLER: Etwas ging schief
                console.error("Fehler beim Schreiben:", error);
                window.alert("Error while saving: " + error.message);
            });
      } else {
        window.alert("Bluetooth is not connected. \nConnect to BLE first!");
      }
    }
    
    function sendNewAPNValue() {
      if (bleServer && bleServer.connected) {
        const valueToSend = APNInput.value;
        // Konvertiere String in Byte-Array
        const encoder = new TextEncoder();
        const data = encoder.encode(valueToSend);
        bleServiceFound.getCharacteristic(APNCharacteristic)
            .then(characteristic => {
                // Schreibe das Byte-Array auf die Charakteristik
                // return characteristic.writeValue(data);
                return characteristic.writeValueWithoutResponse(data); 
            })
            .then(() => {
                // ERFOLG: Anzeige aktualisieren
                //window.alert("New APN saved: " + valueToSend);
                APNContainer.innerHTML = valueToSend;
            })
            .catch(error => {
                // FEHLER: Etwas ging schief
                console.error("Fehler beim Schreiben:", error);
                window.alert("Error while saving: " + error.message);
            });
      } else {
        window.alert("Bluetooth is not connected. \nConnect to BLE first!");
      }
    }


    function sendNewMqttPWValue() {
      if (bleServer && bleServer.connected) {
        const valueToSend = mqttPWInput.value; // Den Text aus dem Eingabefeld holen
   
        // Text in Bytes umwandeln
        const encoder = new TextEncoder();
        const data = encoder.encode(valueToSend);
        
        // Den Wert an den ESP32 senden
        MQTTPWCharacteristicFound.writeValueWithoutResponse(data)
            .then(() => {
                console.log("New MQTT-PW saved: " + valueToSend);
                mqttPWContainer.innerHTML = valueToSend; // Anzeige aktualisieren
            })
            .catch(error => {
                window.alert("Error writing the MQTT PW:", error);
                
            });
      } else {
        window.alert("Nicht verbunden! Bitte erst 'Connect' klicken.");
      }
    }

    function sendNewSleepTimeValue() {
    if (bleServer && bleServer.connected) {
        const inputField = document.getElementById('SleepTimeInput');
        const val = parseInt(inputField.value); // In Ganzzahl umwandeln

        // Prüfung: Ist es eine Zahl und liegt sie zwischen 1 und 360?
        if (isNaN(val) || val < 1 || val > 360) {
            window.alert("Ungültige Eingabe! Bitte eine Zahl zwischen 1 und 360 Minuten eingeben.");
            return; // Funktion hier abbrechen, nichts wird gesendet
        }

        const data = new TextEncoder().encode(val.toString());
        bleServiceFound.getCharacteristic(SleepTimeCharacteristic)
            .then(c => c.writeValueWithoutResponse(data))
            .then(() => { 
                //alert("Sleeptime von " + val + " Min. gespeichert!");
                SleepTimeContainer.innerHTML = val + " Min."; 
            })
            .catch(e => alert("Fehler beim Senden: " + e.message));
            
    } else {
        window.alert("Nicht verbunden!");
    }
}
    
    function disconnectDevice() {
        // console.log("Disconnect Device.");
        if (bleServer && bleServer.connected) {
            if (sensorCharacteristicFound) {
                sensorCharacteristicFound.stopNotifications()
                    .then(() => {
                        // console.log("Notifications Stopped");
                        return bleServer.disconnect();
                    })
                    .then(() => {
                        // console.log("Device Disconnected");
                        bleStateContainer.innerHTML = "Device Disconnected";
                        bleStateContainer.style.color = "#d13a30";
                        updateButtonVisibility(false); // Zurück zum Connect-Button bei Disconnect
                    })
                    .catch(error => {
                        updateButtonVisibility(false); // Zurück zum Connect-Button bei Fehler
                        // console.log("An error occurred:", error);
                    });
            } else {
                // console.log("No characteristic found to disconnect.");
            }
        } else {
            // Throw an error if Bluetooth is not connected
            // console.error("Bluetooth is not connected.");
            window.alert("Bluetooth is not connected.")
        }
    }

    function getDateTime() {
        var currentdate = new Date();
        var day = ("00" + currentdate.getDate()).slice(-2);
        var month = ("00" + (currentdate.getMonth() + 1)).slice(-2);
        var year = currentdate.getFullYear();
        var hours = ("00" + currentdate.getHours()).slice(-2);
        var minutes = ("00" + currentdate.getMinutes()).slice(-2);
        var seconds = ("00" + currentdate.getSeconds()).slice(-2);

        var datetime = day + "/" + month + "/" + year + " at " + hours + ":" + minutes + ":" + seconds;
        return datetime;
    }
    
    function updateButtonVisibility(isConnected) {
        // 1. Haupt-Buttons (Connect/Disconnect) umschalten
      if (isConnected) {
        connectButton.classList.add('hidden');
        disconnectButton.classList.remove('hidden');
      } else {
        connectButton.classList.remove('hidden');
        disconnectButton.classList.add('hidden');
      }

        // 2. Alle Send-Buttons suchen
      const sendButtons = document.querySelectorAll('.input-group button');
    
      sendButtons.forEach(btn => {
        if (isConnected) {
            btn.classList.remove('hidden'); // Anzeigen wenn verbunden
            btn.disabled = false;           // Aktivieren
        } else {
            btn.classList.add('hidden');    // Komplett verstecken wenn getrennt
            btn.disabled = true;            // Sicherungskopie: Deaktivieren
        }
      });
    }

</script>

</html>
